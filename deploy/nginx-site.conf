# images.adamcbloom.com: GPT Image Playground (systemd: gpt-image-playground.service, Node/Next.js on 127.0.0.1:3100).
# Reached only through the Cloudflare Tunnel (cloudflared → http://127.0.0.1:8090); nothing listens on a public port.
# Replaces the Hestia-generated config (removed 2026-11-19).
server {
    listen 127.0.0.1:8090;
    server_name images.adamcbloom.com;

    access_log /var/log/nginx/images.adamcbloom.com.log;
    error_log  /var/log/nginx/images.adamcbloom.com.error.log error;

    # Real visitor IP from Cloudflare (the tunnel connects from localhost).
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    location ~ /\.(?!well-known/) { return 404; }

    # Finished videos straight from disk: the app sends them without a Content-Length, so browsers (Safari, and
    # Cloudflare in front) can't seek; nginx serves proper byte ranges.
    location ~ "^/api/image/([0-9a-f-]{36}-video\.mp4)$" {
        alias /opt/gpt-image-playground/generated-images/$1;
        default_type video/mp4;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Accept-Ranges bytes;
    }

    location / {
        client_max_body_size 512M;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        add_header X-Accel-Buffering no;
        proxy_pass http://127.0.0.1:3100;
    }
}
